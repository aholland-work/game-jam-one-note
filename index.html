<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved appearance before the first paint.
      (() => {
        let theme
        try { theme = localStorage.getItem('one-note:theme') } catch { /* Storage is optional. */ }
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet" />
    <title>One Note</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
